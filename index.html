<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulire Meglio</title>
  <meta name="description" content="Come pulire qualsiasi cosa in modo sicuro e semplice. Descrivi il problema o carica una foto." />
</head>

<body style="
  margin:0;
  min-height:100vh;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:#f8fafc;
  color:#0f172a;
">

  <div style="
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 16px 80px;
  ">

    <!-- HEADER -->
    <header style="margin-bottom:32px;">
      <h1 style="
        font-size:42px;
        margin:0 0 8px;
        color:#0f766e;
      ">
        Pulire Meglio
      </h1>

      <p style="
        margin:0;
        font-size:16px;
        color:#475569;
        max-width:680px;
      ">
        Descrivi cosa devi pulire o carica una foto.  
        Ti diciamo <strong>come farlo in modo sicuro</strong>, senza rovinare nulla.
      </p>
    </header>

    <!-- INPUT CARD -->
    <section style="
      background:#ffffff;
      border:1px solid #e2e8f0;
      border-radius:16px;
      padding:24px;
      box-shadow:0 10px 25px rgba(15,23,42,0.06);
    ">

      <label for="q" style="
        display:block;
        font-weight:600;
        margin-bottom:8px;
        color:#0f172a;
      ">
        Cosa devi pulire
      </label>

      <textarea
        id="q"
        rows="4"
        placeholder="Esempio: forno incrostato, calcare nel box doccia, macchia di vino sul tappeto"
        style="
          width:100%;
          padding:14px;
          border-radius:10px;
          border:1px solid #cbd5e1;
          background:#ffffff;
          color:#0f172a;
          resize:vertical;
          outline:none;
          font-size:15px;
        "
      ></textarea>

      <div style="
        display:flex;
        gap:16px;
        margin-top:20px;
        flex-wrap:wrap;
        align-items:flex-end;
      ">

        <!-- IMAGE -->
        <div style="flex:1; min-width:240px;">
          <label for="img" style="
            display:block;
            font-weight:600;
            margin-bottom:6px;
          ">
            Foto (opzionale)
          </label>

          <input
            id="img"
            type="file"
            accept="image/*"
            style="color:#475569;"
          />

          <div id="imgMeta" style="
            margin-top:6px;
            font-size:14px;
            color:#64748b;
          "></div>
        </div>

        <!-- CTA -->
        <div style="min-width:220px;">
          <button
            id="btnSolve"
            type="button"
            style="
              width:100%;
              height:46px;
              border-radius:12px;
              border:none;
              font-weight:700;
              font-size:16px;
              cursor:pointer;
              background:#0f766e;
              color:white;
              box-shadow:0 6px 14px rgba(15,118,110,0.25);
            "
          >
            Genera risposta
          </button>

          <div id="status" style="
            margin-top:8px;
            font-size:14px;
            color:#64748b;
          "></div>
        </div>

      </div>
    </section>

    <!-- ANSWER -->
    <section id="answer" style="display:none; margin-top:32px;">

      <h2 id="ansTitle" style="
        font-size:24px;
        margin-bottom:6px;
        color:#0f172a;
      ">
        Risposta
      </h2>

      <div id="ansMeta" style="
        font-size:14px;
        color:#64748b;
        margin-bottom:12px;
      "></div>

      <div id="ansBody" style="
        background:#ffffff;
        border:1px solid #e2e8f0;
        border-radius:16px;
        padding:24px;
        box-shadow:0 10px 25px rgba(15,23,42,0.06);
        line-height:1.55;
      "></div>

    </section>

    <!-- FOOTER -->
    <footer style="
      margin-top:48px;
      padding-top:16px;
      border-top:1px solid #e2e8f0;
      font-size:13px;
      color:#64748b;
    ">
      Risposte generate con AI.  
      Testa sempre in un punto nascosto prima di applicare su superfici delicate.
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
