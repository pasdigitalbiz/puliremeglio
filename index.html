<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pulire Meglio</title>
    <meta
      name="description"
      content="Consigli pratici e sicuri per pulire casa, vestiti, esterni e auto."
    />

    <style>
      :root {
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;

        --brand: #0f766e;
        --brandDark: #0b5f59;
        --brandSoft: #e7f6f4;

        --ok: #16a34a;

        --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        --shadowSoft: 0 10px 22px rgba(15, 23, 42, 0.06);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial;
        color: var(--text);
        background: radial-gradient(1200px 600px at 20% 0%, #eef7ff 0%, var(--bg) 55%)
          no-repeat;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 42px 18px 70px;
      }

      /* HERO */

      .hero {
        margin-bottom: 26px;
      }

      .brandRow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }

      .logo {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--brand) 0%, #22c55e 140%);
        box-shadow: var(--shadowSoft);
      }

      h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .sub {
        margin: 10px 0 0;
        font-size: 18px;
        color: var(--muted);
        max-width: 60ch;
      }

      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 18px;
      }

      .check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 999px;
        background: #ffffff;
        border: 1px solid var(--border);
        font-weight: 700;
        font-size: 14px;
        color: var(--text);
      }

      .checkIcon {
        color: var(--ok);
        font-size: 16px;
        line-height: 1;
      }

      /* CARD */

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.35fr 0.65fr;
        gap: 16px;
      }

      @media (max-width: 860px) {
        h1 {
          font-size: 34px;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }

      label {
        display: block;
        font-weight: 800;
        margin: 6px 0 10px;
        font-size: 16px;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid var(--border);
        font-size: 16px;
        resize: vertical;
      }

      textarea:focus {
        border-color: rgba(15, 118, 110, 0.45);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        outline: none;
      }

      .help {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .examples {
        margin-top: 8px;
        font-size: 14px;
        color: #6b7280;
      }

      .rightCol {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .fileBox {
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: #ffffff;
      }

      .btn {
        height: 52px;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 900;
        font-size: 16px;
        color: #ffffff;
        background: linear-gradient(135deg, var(--brand) 0%, #0ea5a4 140%);
        box-shadow: 0 14px 28px rgba(15, 118, 110, 0.22);
      }

      .btn:hover {
        box-shadow: 0 18px 36px rgba(15, 118, 110, 0.26);
      }

      .status {
        min-height: 18px;
        font-size: 14px;
        color: var(--muted);
      }

      .answer {
        display: none;
        margin-top: 18px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="hero">
        <div class="brandRow">
          <div class="logo"></div>
          <div>
            <h1>Come pulire nel modo giusto</h1>
            <p class="sub">
              Consigli pratici e sicuri per pulire senza fare danni.
            </p>
          </div>
        </div>

        <div class="checks">
          <div class="check"><span class="checkIcon">✔</span>Procedura chiara</div>
          <div class="check"><span class="checkIcon">✔</span>Errori da evitare</div>
          <div class="check"><span class="checkIcon">✔</span>Metodo prudente</div>
        </div>
      </div>

      <div class="card">
        <div class="grid">
          <div>
            <label for="q">Cosa devi pulire</label>
            <textarea
              id="q"
              placeholder="Es. macchia di vino sul tappeto"
            ></textarea>

            <div class="help">
              Scrivi cosa devi pulire e che problema c’è.
              <div class="examples">
                Esempi: macchia di caffè sul tappeto · aloni sul lavandino · grasso nel forno
              </div>
            </div>
          </div>

          <div class="rightCol">
            <div class="fileBox">
              <label for="img">Foto (opzionale)</label>
              <input id="img" type="file" accept="image/*" />
            </div>

            <button id="btnSolve" class="btn">Vai alla soluzione</button>
            <div id="status" class="status"></div>
          </div>
        </div>
      </div>

      <div id="answer" class="answer"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
