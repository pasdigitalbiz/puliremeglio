<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pulire Meglio</title>
</head>
<body style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; max-width: 900px; margin: 30px auto; padding: 0 16px;">
  <h1>Pulire Meglio</h1>
  <p>Descrivi cosa devi pulire o carica una foto. Premi “Genera risposta”.</p>

  <label for="q" style="display:block; font-weight:600; margin: 12px 0 6px;">Descrizione</label>
  <textarea id="q" rows="4" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:10px;"
    placeholder="Esempio: forno incrostato, calcare nel box doccia, macchia di vino sul tappeto"></textarea>

  <div style="display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-top: 12px;">
    <div style="flex: 1; min-width: 260px;">
      <label for="img" style="display:block; font-weight:600; margin: 12px 0 6px;">Foto (opzionale)</label>
      <input id="img" type="file" accept="image/*" />
      <div id="imgMeta" style="margin-top:6px; color:#666; font-size: 14px;"></div>
    </div>

    <div style="min-width: 220px;">
      <button id="btnSolve" type="button"
        style="width:100%; height:44px; border-radius:10px; border:1px solid #111; background:#22c55e; font-weight:700; cursor:pointer;">
        Genera risposta
      </button>
      <div id="status" style="margin-top:6px; color:#666; font-size: 14px;"></div>
    </div>
  </div>

  <hr style="margin: 18px 0; border: none; border-top: 1px solid #eee;" />

  <div id="answer" style="display:none;">
    <h2 id="ansTitle" style="margin: 0 0 8px;">Risposta</h2>
    <div id="ansMeta" style="color:#666; font-size: 14px; margin-bottom: 10px;"></div>
    <div id="ansBody" style="border:1px solid #eee; border-radius: 12px; padding: 14px;"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
